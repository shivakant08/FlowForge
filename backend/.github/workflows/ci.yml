name: Continuous Integration

# Event Triggers: Run workflow on push or PR to main/master branches
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs if a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime and enable automatic dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches ~/.npm to speed up subsequent runs

      # Step 3: Clean install dependencies (uses package-lock.json strictly)
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linter/typechecks (optional but recommended)
      - name: Check TypeScript types
        run: npm run typecheck --if-present

      # Step 5: Execute the Jest test suite
      - name: Run Jest tests
        run: npx jest --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://flowforge:flowforge_dev@localhost:5432/flowforge"
          JWT_ACCESS_SECRET: "ci-secret-access-key"
          JWT_REFRESH_SECRET: "ci-secret-refresh-key"